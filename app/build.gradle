plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.speedster"
    compileSdk 34

    defaultConfig {
        applicationId "com.speedster"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

// The Great Harvester: Rips jars out of AARs so kotlinc can read them
tasks.register("harvestDeps") {
    doLast {
        def dest = file("build/harvested_libs")
        dest.deleteDir()
        dest.mkdirs()
        
        configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def file = artifact.file
            if (file.name.endsWith(".jar")) {
                copy {
                    from file
                    into dest
                }
            } else if (file.name.endsWith(".aar")) {
                copy {
                    from zipTree(file).matching { include "classes.jar" }
                    into dest
                    rename "classes.jar", "${artifact.moduleVersion.id.group}-${artifact.name}-${artifact.moduleVersion.id.version}.jar"
                }
            }
        }
        println "✅ Harvested ${dest.listFiles().size()} libraries into the Armory."
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.02.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime'
}